    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#D9A441"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="440" fill="#E9DFC9"/>
  <rect x="110" y="30" width="420" height="380" fill="#6B8CAE" stroke="#ffffff" stroke-width="3"/>
  <rect x="110" y="150" width="420" height="60" fill="#8FB0D0"/>
  <rect x="110" y="270" width="420" height="60" fill="#8FB0D0"/>
  <line x1="110" y1="210" x2="530" y2="210" stroke="#ffffff" stroke-width="4"/>
