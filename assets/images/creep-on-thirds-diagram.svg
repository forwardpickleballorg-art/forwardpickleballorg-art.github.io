  <line x1="240" y1="345" x2="240" y2="285" stroke="#D9A441" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="400" y1="345" x2="400" y2="285" stroke="#D9A441" stroke-width="5" marker-end="url(#arrow)"/>
  <circle cx="240" cy="360" r="17" fill="#1F2937" stroke="#ffffff" stroke-width="2"/>
  <circle cx="400" cy="360" r="17" fill="#1F2937" stroke="#ffffff" stroke-width="2"/>
</svg>
