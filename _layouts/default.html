<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 200 }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta name="twitter:card" content="summary">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://forwardpickleball.org/#organization",
        "name": "Forward Pickleball",
        "alternateName": "Dive Forward Pickleball",
        "url": "https://forwardpickleball.org/",
        "logo": "https://forwardpickleball.org/assets/images/logo.svg",
        "email": "forward.pickleball.org@gmail.com",
        "description": {{ site.description | jsonify }},
        "founder": { "@id": "https://forwardpickleball.org/#louie-kwan" },
        "areaServed": [
          { "@type": "City", "name": "Kanata" },
          { "@type": "City", "name": "Ottawa" }
        ]
      },
      {
        "@type": "Person",
        "@id": "https://forwardpickleball.org/#louie-kwan",
        "name": "Louie Kwan",
        "jobTitle": "Pickleball Coach",
        "description": "Certified NCCP pickleball coach in Kanata and Ottawa.",
        "worksFor": { "@id": "https://forwardpickleball.org/#organization" },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kanata",
          "addressRegion": "Ontario",
          "addressCountry": "CA"
        },
        "areaServed": [
          { "@type": "City", "name": "Kanata" },
          { "@type": "City", "name": "Ottawa" }
        ],
        "knowsAbout": ["Pickleball coaching", "Doubles strategy", "Pickleball drills"]
      }
    ]
  }
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏓</text></svg>">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E7326CV00T"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-E7326CV00T');
  </script>
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
